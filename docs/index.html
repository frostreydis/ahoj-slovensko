*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--blue)}
h1,h2,h3,h4{line-height:1.25;margin:.2em 0 .5em}
h1{font-size:1.55rem} h2{font-size:1.3rem} h3{font-size:1.1rem} h4{font-size:1rem}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top-inner{max-width:1050px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:8px 16px}
.brand{font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:8px}

nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--muted);white-space:nowrap;font-weight:500}
nav.tabs a.active{background:var(--blue-soft);color:var(--blue)}

main{max-width:1050px;margin:0 auto;padding:18px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin:0 0 14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.muted{color:var(--muted)} .small{font-size:.88rem} .center{text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.small{padding:4px 10px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--blue-soft);color:var(--blue)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.gray{background:var(--line);color:var(--muted)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#3b82f6);border-radius:99px}
.stat{font-size:1.6rem;font-weight:700}
.sk{color:var(--blue);font-weight:600;cursor:pointer;border-bottom:1px dashed transparent}
.sk::after{content:" 🔊";font-size:.75em;opacity:.55}
.nosay .sk::after{content:""}
table{border-collapse:collapse;width:100%;margin:8px 0 12px;font-size:.95rem}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--blue-soft);font-weight:600}
.tblwrap{overflow-x:auto}
.note{background:var(--amber-soft);border-left:4px solid var(--amber);padding:10px 14px;border-radius:8px;margin:10px 0}
.tip{background:var(--blue-soft);border-left:4px solid var(--blue);padding:10px 14px;border-radius:8px;margin:10px 0}
.good{background:var(--green-soft);border-left:4px solid var(--green);padding:10px 14px;border-radius:8px;margin:10px 0}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.subtabs button{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:6px 12px;border-radius:99px;font:inherit;cursor:pointer}
.subtabs button.active{background:var(--blue);border-color:var(--blue);color:#fff}
ul.check{list-style:none;padding-left:0} ul.check li{padding:3px 0 3px 26px;position:relative}
ul.check li::before{content:"✓";position:absolute;left:4px;color:var(--green);font-weight:700}
.lesson-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin:6px 0;background:var(--card);text-decoration:none;color:var(--text)}
.lesson-item .num{font-weight:700;color:var(--blue);min-width:40px}
.ex-box{max-width:640px;margin:0 auto}
.ex-q{font-size:1.15rem;margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--text);padding:11px 14px;border-radius:12px;font:inherit;cursor:pointer}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
input[type=text],input[type=number],select,textarea{font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);width:100%}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--blue)}
input.ok{border-color:var(--green);background:var(--green-soft)} input.bad{border-color:var(--red);background:var(--red-soft)}
.dia{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.dia button{min-width:34px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.tokens{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px;border:1.5px dashed var(--line);border-radius:12px;margin:6px 0}
.tok{padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:var(--blue-soft);color:var(--text);cursor:pointer;font:inherit}
.feedback{margin-top:12px;padding:10px 14px;border-radius:10px}
.feedback.ok{background:var(--green-soft)} .feedback.bad{background:var(--red-soft)} .feedback.dia{background:var(--amber-soft)}

.flash .front{font-size:1.7rem;font-weight:700}
.flash .back{font-size:1.25rem}
.srs-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.srs-btns .btn{justify-content:center;flex-direction:column;gap:0}
.srs-btns small{font-weight:400;color:var(--muted);font-size:.75rem}
.big-phrase{font-size:1.5rem;font-weight:700;color:var(--blue);margin:6px 0}
.timer{font-variant-numeric:tabular-nums;font-size:1.4rem;font-weight:700}
details.stage{margin:0 0 12px}
details.stage>summary{cursor:pointer;list-style:none}
details.stage>summary::-webkit-details-marker{display:none}
details.mod{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0;background:var(--card)}
details.mod>summary{cursor:pointer;font-weight:600}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;margin-top:8px}
.kv b{color:var(--muted);font-weight:600}
.done-mark{color:var(--green);font-weight:700}
.week-plan td:first-child{white-space:nowrap;font-weight:600}
.today-row{background:var(--blue-soft)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.95}

@media (hover:hover){
  .btn:hover,.lesson-item:hover,.opt:hover:not(:disabled),.dia button:hover{border-color:var(--blue)}
  .btn.primary:hover{filter:brightness(1.08)}
  .sk:hover{border-bottom-color:var(--blue)}
}
@media (pointer:coarse){.kbd{display:none}}
.lc-more{margin-top:8px}
.lc-more>summary{cursor:pointer;padding:4px 0}
.lc-more>.row{margin-top:4px!important}
.update-bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:10px;background:var(--card);color:var(--text);border:1px solid var(--blue);border-radius:12px;padding:8px 10px 8px 14px;box-shadow:0 4px 16px rgba(16,24,40,.18);max-width:calc(100% - 24px)}
.warn-banner{background:var(--amber-soft);border:1px solid var(--amber);color:var(--text);padding:8px 12px;border-radius:10px;margin-bottom:12px;font-size:.92rem}
/* Між телефоном і широким екраном повні підписи вкладок не вміщаються поруч із назвою, тож вкладки — як у мобільній навігації */
@media (min-width:701px) and (max-width:1100px){
  nav.tabs a{display:flex;flex-direction:column;align-items:center;padding:4px 8px;font-size:.85rem;line-height:1.25}
  nav.tabs a .lbl{display:none}
  nav.tabs a .lbl-s{display:block;font-size:.72rem}
}
@media (max-width:700px){
  body{font-size:15.5px}
  .top-inner{padding:8px 12px}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;z-index:30}
  nav.tabs a{flex:1;min-width:0;padding:6px 2px;font-size:.78rem;display:flex;flex-direction:column;align-items:center}
  nav.tabs a .lbl{display:none}
  nav.tabs a .lbl-s{display:block;font-size:.68rem}
  .kv{grid-template-columns:1fr}
  .srs-btns{grid-template-columns:repeat(2,1fr)}
  .card{padding:14px}
  h1{font-size:1.3rem}
  main{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .update-bar{bottom:calc(76px + env(safe-area-inset-bottom))}
  /* Шапка уроку: мета видна лише на теорії, вкладки — одним рядком із прокруткою, щоб вправа була на першому екрані */
  .lesson-head:not(.tab-theory) .lesson-goals{display:none}
  .subtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:4px}
  .subtabs button{flex:none}
  /* Два ряди по 9 клавіш на всю ширину: вищі кнопки легше влучити пальцем, а займають менше місця, ніж три ряди */
  .dia{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
  .dia button{min-width:0;height:42px;padding:0}
}
@media print{
  header.top,nav.tabs,.btn,.subtabs,.no-print{display:none!important}
  body{background:#fff;color:#000} .card{box-shadow:none;border-color:#ccc}
  details{display:block} details>*{display:block}
  main{padding:0}
}

<script>
/* Ahoj, Slovensko — тренажер словацької: стан, озвучення, запис, перевірка відповідей, інтервальне повторення */
window.SK = window.SK || {};
(function (SK) {
  'use strict';

  // ---------- Стан ----------
  // Увесь прогрес лежить у localStorage сайту під цим ключем. Ключ НЕ змінювати: інакше збережений прогрес не відкриється.
  const STORE_KEY = 'sk-trainer-v1';
  const VERSION = 1;   // версія схеми стану: змінили формат → +1 і крок у MIGRATIONS
  const DEFAULTS = {
    v: VERSION,
    start: null,
    settings: { voice: '', rate: 0.9, strict: false, newPerDay: 10, dir: 'mix' },
    lessons: {},   // id -> {opened, theory, ex:{best,done}, speak, mission}
    modules: {},   // id модуля програми -> true
    cards: {},     // id картки -> {due,int,ease,reps,lapses}
    custom: [],    // власні слова [{sk,uk}]
    days: {},      // номер дня -> {ex, cards, speak}
    newDay: { day: 0, count: 0 },
    ui: { installTip: true }   // показувати на «Сьогодні» пораду встановити тренажер як додаток
  };
  // MIGRATIONS[n](s) переводить стан версії n у версію n + 1 (змінює s на місці)
  const MIGRATIONS = {};
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const UNSAFE = new Set(['__proto__', 'constructor', 'prototype']);
  function merge(base, extra) {
    for (const k of Object.keys(extra || {})) {
      if (UNSAFE.has(k)) continue;
      if (extra[k] && typeof extra[k] === 'object' && !Array.isArray(extra[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) merge(base[k], extra[k]);
      else base[k] = extra[k];
    }
    return base;
  }
  function migrate(s) {
    s.v = Math.floor(+s.v) || 1;
    while (s.v < VERSION && MIGRATIONS[s.v]) { MIGRATIONS[s.v](s); s.v++; }
    return s;
  }
  // Налаштування потрапляють у розмітку, тож вони мають бути саме числами й відомими рядками
  function tidy(s) {
    const st = s.settings;
    st.voice = String(st.voice || '');
    st.rate = Math.min(1.2, Math.max(0.5, +st.rate || 0.9));
    st.strict = !!st.strict;
    st.newPerDay = Math.min(50, Math.max(0, Math.round(+st.newPerDay) || 0));
    if (!['mix', 'sk', 'uk'].includes(st.dir)) st.dir = 'mix';
    if (!Array.isArray(s.custom)) s.custom = [];
    return s;
  }
  // newer — прогрес записала новіша версія тренажера: тоді нічого не записуємо, щоб старий код його не зіпсував;
  // broken — збережене не вдалося прочитати; failed — останній запис не вдався
  SK.store = { key: STORE_KEY, newer: false, broken: null, failed: null };
  function load() {
    let raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { SK.store.broken = e; console.warn('Сховище недоступне', e); return clone(DEFAULTS); }
    if (!raw) return clone(DEFAULTS);
    try {
      const data = JSON.parse(raw);
      if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('не об\'єкт');
      SK.store.newer = (+data.v || 1) > VERSION;
      return tidy(merge(clone(DEFAULTS), migrate(data)));
    } catch (e) {
      // Наступне збереження затерло б пошкоджений запис, тому копія лишається поруч для ручного відновлення
      SK.store.broken = e;
      console.warn('Не вдалося прочитати прогрес; копію збережено під ключем ' + STORE_KEY + '-broken', e);
      try { localStorage.setItem(STORE_KEY + '-broken', raw); } catch (e2) { console.warn(e2); }
      return clone(DEFAULTS);
    }
  }
  SK.S = load();
  let warnedAt = 0;
  SK.save = function () {
    if (SK.store.newer) return;
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(SK.S));
      SK.store.failed = null;
    } catch (e) {
      SK.store.failed = e;
      console.warn('Прогрес не збережено', e);
      if (Date.now() - warnedAt > 60000 && document.body) {
        warnedAt = Date.now();
        SK.toast('⚠️ Прогрес не зберігся (' + (e && e.name || e) + '). Подробиці — у ⚙️ «Налаштування».', 6000);
      }
    }
  };
  // Зберігається завжди весь стан, тож без перечитування наступне збереження тут затерло б те, що записала
  // інша вкладка чи встановлений додаток. Екран перемальовує SK.onExternalChange (views2.js).
  window.addEventListener('storage', (e) => {
    if (e.key !== STORE_KEY && e.key !== null) return;   // null — сховище сайту очистили повністю
    SK.S = load();
    if (SK.onExternalChange) SK.onExternalChange();
  });

  // persisted: true — Chrome не видалить дані сайту сам, навіть коли забракне місця; false — може; null — невідомо.
  // Chrome вирішує без запитання: зазвичай дозволяє встановленим додаткам, закладкам і сайтам, якими часто користуються.
  SK.Storage = {
    persisted: null, listeners: [],
    async check(ask) {
      const st = navigator.storage;
      if (!st || !st.persisted) return this.persisted;
      try {
        let p = await st.persisted();
        if (!p && ask && st.persist) p = await st.persist();
        this.persisted = !!p;
      } catch (e) { this.persisted = null; }
      this.listeners.forEach((f) => f());
      return this.persisted;
    }
  };
  SK.isInstalled = () => !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  // Chrome віддає подію beforeinstallprompt один раз; зберігаємо її, щоб кнопка «Встановити» спрацювала пізніше
  SK.Install = {
    prompt: null, listeners: [],
    notify() { this.listeners.forEach((f) => f()); },
    async run() {
      const p = this.prompt; if (!p) return;
      this.prompt = null;
      p.prompt();
      try { await p.userChoice; } catch (e) { console.warn(e); }
      this.notify();
    }
  };
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); SK.Install.prompt = e; SK.Install.notify(); });
  window.addEventListener('appinstalled', () => { SK.Install.prompt = null; SK.Storage.check(true); SK.Install.notify(); });
  SK.replaceState = function (obj) { SK.S = merge(clone(DEFAULTS), obj); SK.save(); };
  SK.resetState = function () { SK.S = clone(DEFAULTS); SK.save(); };
  // Часткові скидання (зберігають налаштування)
  SK.resetLessons = function () { SK.S.lessons = {}; SK.S.modules = {}; SK.save(); };
  SK.resetWords = function () { SK.S.cards = {}; SK.S.newDay = { day: 0, count: 0 }; SK.save(); };

  // ---------- Дати ----------
  SK.today = function () {
    const d = new Date();
    return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000);
  };
  SK.dayOfWeek = function (dayNum) { return new Date(dayNum * 86400000).getUTCDay(); }; // 0 = неділя
  SK.logActivity = function (kind, n) {
    const t = SK.today();
    const d = SK.S.days[t] || (SK.S.days[t] = { ex: 0, cards: 0, speak: 0 });
    d[kind] = (d[kind] || 0) + (n || 1);
    if (!SK.S.start) SK.S.start = t;
    SK.save();
  };
  // Серія навчальних днів: вихідні не розривають серію
  SK.streak = function () {
    const t = SK.today();
    let day = t, count = 0;
    if (!SK.S.days[t]) day = t - 1;
    for (let i = 0; i < 800; i++, day--) {
      const active = !!SK.S.days[day];
      const wd = SK.dayOfWeek(day);
      if (active) count++;
      else if (wd === 0 || wd === 6) continue;
      else break;
    }
    return count;
  };

  // ---------- Утиліти ----------
  SK.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  SK.shuffle = function (a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  // [[текст]] або [[текст|що озвучити]] -> клікабельний словацький фрагмент
  SK.rich = function (html) {
    return String(html || '').replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, shown, said) =>
      '<span class="sk" data-say="' + SK.esc(said || shown) + '">' + shown + '</span>');
  };
  SK.toast = function (msg, ms) {
    let el = document.getElementById('toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = msg; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), ms || 2200);
  };
  // Телефон чи планшет: там екранна клавіатура закриває пів екрана, а підказки про клавіші не мають сенсу
  SK.touch = () => !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);

  // ---------- Перевірка відповідей ----------
  SK.norm = (s) => String(s).toLowerCase().replace(/[.,!?;:"„“”'«»()…–—-]/g, ' ').replace(/\s+/g, ' ').trim();
  SK.stripDia = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
  // 'ok' | 'dia' (правильно, але без/з неправильною діакритикою) | 'bad'
  SK.check = function (input, answers) {
    const list = Array.isArray(answers) ? answers : [answers];
    const n = SK.norm(input);
    if (!n) return 'bad';
    if (list.some((a) => SK.norm(a) === n)) return 'ok';
    if (list.some((a) => SK.stripDia(SK.norm(a)) === SK.stripDia(n))) return 'dia';
    return 'bad';
  };

  // ---------- Озвучення (Web Speech API) ----------
  // Два рушії: 1) словацький голос системи (Web Speech API, працює й офлайн);
  // 2) словацький онлайн-голос Google (потрібен інтернет) — коли словацького голосу в системі немає
  // (macOS без завантаженого голосу Laura, Chrome на Windows без словацького мовлення тощо) або коли учень вибрав його сам.
  // Словацький текст ніколи не віддаємо несловацькому голосу: браузер прочитав би його з англійською вимовою.
  const ONLINE = '@online';   // значення settings.voice для онлайн-голосу; '' — вибір автоматично
  const ONLINE_URLS = [       // друга адреса — запасна, якщо перша не відповіла
    (q) => 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=sk&q=' + encodeURIComponent(q),
    (q) => 'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=sk&q=' + encodeURIComponent(q)
  ];
  // Онлайн-сервіс приймає до ~200 символів за запит: ріжемо за реченнями, а задовгі речення — між словами
  SK.ttsChunks = function (text, max) {
    const out = [];
    let cur = '';
    for (const w of String(text).replace(/\s+/g, ' ').trim().split(' ')) {
      if (cur && (cur + ' ' + w).length > max) { out.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w;
      if (/[.!?…]$/.test(cur) && cur.length > max / 2) { out.push(cur); cur = ''; }
    }
    if (cur) out.push(cur);
    return out;
  };
  const natural = (v) => /natural/i.test(v.name);
  SK.TTS = {
    ONLINE,
    voices: [],
    ready: false, settled: false, listeners: [],
    system: 'speechSynthesis' in window,
    audio: null,
    token: 0,                 // події застарілого озвучення (після нового say) мають ігноруватися
    init() {
      const notify = () => this.listeners.forEach((f) => f());
      window.addEventListener('online', notify);
      window.addEventListener('offline', notify);
      if (!this.system) { this.ready = this.settled = true; notify(); return; }
      const load = () => {
        this.voices = speechSynthesis.getVoices().filter((v) => v && v.lang && /^sk([-_]|$)/i.test(v.lang) && v.name && v.name !== 'undefined');
        this.ready = true;
        notify();
      };
      load();
      speechSynthesis.onvoiceschanged = load;
      setTimeout(() => { this.settled = true; load(); }, 1500);
    },
    // Словацький голос системи, яким говоримо зараз, або null — тоді говорить онлайн-голос
    voice() {
      const v = this.voices, want = SK.S.settings.voice;
      if (want === ONLINE) return null;
      return v.find((x) => x.name === want) || v.find(natural) || v[0] || null;
    },
    label() { const v = this.voice(); return v ? v.name : 'Google — словацький, онлайн'; },
    // true — озвучити нічим: словацького голосу в системі немає, а інтернету для онлайн-голосу теж немає
    silent() { return this.settled && !this.voices.length && navigator.onLine === false; },
    stop() {
      this.token++;
      if (this.system) speechSynthesis.cancel();
      if (this.audio) this.audio.pause();
    },
    say(text, rate) {
      if (!text) return;
      this.stop();
      rate = rate || SK.S.settings.rate || 0.9;
      const v = this.voice();
      if (v) this.sayLocal(text, rate, v); else this.sayOnline(text, rate);
    },
    sayLocal(text, rate, v) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'sk-SK';
      u.voice = v;
      u.rate = rate;
      speechSynthesis.speak(u);
    },
    sayOnline(text, rate) {
      const parts = SK.ttsChunks(text, 180), token = this.token;
      // Один <audio> на всю сесію: Safari дозволяє вже «розблокованому» елементу грати без нового натискання
      const a = this.audio || (this.audio = new Audio());
      let i = 0, url = 0;
      const play = () => {
        a.src = ONLINE_URLS[url](parts[i]);
        a.defaultPlaybackRate = a.playbackRate = rate;   // нове src скидає швидкість, тому лише після нього
        a.play().catch((e) => { if (token === this.token && e && e.name === 'NotAllowedError') SK.toast('Натисніть 🔊, щоб послухати'); });
      };
      a.onended = () => { if (token === this.token && ++i < parts.length) play(); };
      a.onerror = () => {
        if (token !== this.token) return;
        if (++url < ONLINE_URLS.length) { play(); return; }
        const v = this.voices.find(natural) || this.voices[0];
        if (v) { this.sayLocal(parts.slice(i).join(' '), rate, v); return; }   // без інтернету рятує системний голос, якщо він є
        SK.toast('🔇 Онлайн-голос недоступний (немає інтернету?), а словацького голосу в системі немає. Див. ⚙️ «Налаштування».');
      };
      play();
    }
  };

  // ---------- Запис власного голосу ----------
  SK.Rec = {
    mr: null, url: null,
    supported: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder),
    async start(onStop, onError) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const chunks = [];
        this.mr = new MediaRecorder(stream);
        this.mr.ondataavailable = (e) => chunks.push(e.data);
        this.mr.onstop = () => {
          stream.getTracks().forEach((t) => t.stop());
          if (this.url) URL.revokeObjectURL(this.url);
          this.url = URL.createObjectURL(new Blob(chunks, { type: this.mr.mimeType || 'audio/webm' }));
          onStop(this.url);
        };
        this.mr.start();
      } catch (e) { onError(e); }
    },
    stop() { if (this.mr && this.mr.state !== 'inactive') this.mr.stop(); },
    active() { return !!(this.mr && this.mr.state === 'recording'); }
  };

  // Віджет: кнопка запису + програвач
  SK.recorderWidget = function (container) {
    if (!SK.Rec.supported) {
      container.innerHTML = '<span class="small muted">Запис голосу недоступний у цьому браузері.</span>';
      return;
    }
    container.innerHTML = '<button class="btn rec-btn">● Записати себе</button> <audio class="rec-audio" controls style="display:none;vertical-align:middle;max-width:260px"></audio>';
    const btn = container.querySelector('.rec-btn');
    const audio = container.querySelector('.rec-audio');
    btn.onclick = () => {
      if (SK.Rec.active()) { SK.Rec.stop(); return; }
      SK.Rec.start((url) => {
        btn.textContent = '● Записати ще раз';
        audio.src = url; audio.style.display = '';
        SK.logActivity('speak');
      }, (e) => {
        btn.textContent = '● Записати себе';
        SK.toast('Немає доступу до мікрофона: ' + (e && e.name ? e.name : e));
      });
      btn.textContent = '■ Зупинити запис';
    };
  };

  // ---------- Уроки ----------
  SK.lessons = SK.lessons || [];
  SK.lessonById = (id) => SK.lessons.find((l) => l.id === id);
  SK.lessonState = function (id) { return SK.S.lessons[id] || (SK.S.lessons[id] = {}); };
  // Стан уроку: {opened, theory, ex:{best,done}, speak, mission, skipped, run}
  //   done    — вправи виконано на ≥ 80%;  skipped — учень пропустив урок («вже знаю» / «почати з іншого уроку»);
  //   run     — незавершений підхід до вправ (див. exercises.js), щоб продовжити пізніше
  SK.lessonDone = (id) => !!(SK.S.lessons[id] && SK.S.lessons[id].ex && SK.S.lessons[id].ex.done);
  SK.lessonSkipped = (id) => !!(SK.S.lessons[id] && SK.S.lessons[id].skipped) && !SK.lessonDone(id);
  SK.lessonClosed = (id) => SK.lessonDone(id) || SK.lessonSkipped(id);
  SK.currentLesson = function () { return SK.lessons.find((l) => !SK.lessonClosed(l.id)) || SK.lessons[SK.lessons.length - 1]; };
  SK.skipLesson = function (id, on) { const st = SK.lessonState(id); if (on) st.skipped = true; else delete st.skipped; SK.save(); };
  // Пройти урок наново: скидаються позначки й вправи; слова уроку лишаються в повторенні
  SK.resetLesson = function (id) { const st = SK.lessonState(id); ['theory', 'ex', 'speak', 'mission', 'skipped', 'run'].forEach((k) => delete st[k]); SK.save(); };
  // Почати з уроку id: усі попередні незавершені уроки позначаються як пропущені
  SK.startFrom = function (id) {
    for (const l of SK.lessons) { if (l.id === id) break; if (!SK.lessonDone(l.id)) SK.lessonState(l.id).skipped = true; }
    delete SK.lessonState(id).skipped;
    SK.save();
  };

  // ---------- Інтервальне повторення ----------
  SK.cardId = (lessonId, sk) => lessonId + '|' + sk;
  // Усі слова з відкритих уроків + власні
  SK.allWords = function () {
    const out = [];
    SK.lessons.forEach((l) => {
      if (!(SK.S.lessons[l.id] && SK.S.lessons[l.id].opened)) return;
      (l.vocab || []).forEach((w) => out.push({ id: SK.cardId(l.id, w[0]), sk: w[0], uk: w[1], note: w[2] || '', lesson: l.id }));
    });
    SK.S.custom.forEach((w) => out.push({ id: SK.cardId('my', w.sk), sk: w.sk, uk: w.uk, note: w.note || '', lesson: 'my' }));
    return out;
  };
  SK.srsQueue = function () {
    const t = SK.today();
    const words = SK.allWords();
    const due = SK.shuffle(words.filter((w) => SK.S.cards[w.id] && SK.S.cards[w.id].due <= t));
    if (SK.S.newDay.day !== t) SK.S.newDay = { day: t, count: 0 };
    const room = Math.max(0, (SK.S.settings.newPerDay || 10) - SK.S.newDay.count);
    const fresh = words.filter((w) => !SK.S.cards[w.id]).slice(0, room);
    return { due, fresh, total: due.length + fresh.length };
  };
  SK.srsCounts = function () {
    const t = SK.today();
    const words = SK.allWords();
    const due = words.filter((w) => SK.S.cards[w.id] && SK.S.cards[w.id].due <= t).length;
    const known = words.filter((w) => SK.S.cards[w.id] && SK.S.cards[w.id].reps > 0).length;
    const unseen = words.filter((w) => !SK.S.cards[w.id]).length;
    return { due, known, unseen, all: words.length };
  };
  // grade: 1 знову, 2 важко, 3 добре, 4 легко
  SK.srsGrade = function (word, grade) {
    const t = SK.today();
    let c = SK.S.cards[word.id];
    if (!c) {
      c = SK.S.cards[word.id] = { due: t, int: 0, ease: 2.5, reps: 0, lapses: 0 };
      if (SK.S.newDay.day !== t) SK.S.newDay = { day: t, count: 0 };
      SK.S.newDay.count++;
    }
    if (grade === 1) {
      c.lapses++; c.reps = 0; c.int = 0; c.ease = Math.max(1.3, c.ease - 0.2); c.due = t;
    } else {
      let next;
      if (c.reps === 0) next = grade === 4 ? 3 : 1;
      else if (c.reps === 1) next = grade === 2 ? 2 : grade === 4 ? 6 : 4;
      else next = Math.round(c.int * (grade === 2 ? 1.2 : grade === 4 ? c.ease * 1.3 : c.ease));
      if (grade === 2) c.ease = Math.max(1.3, c.ease - 0.15);
      if (grade === 4) c.ease += 0.15;
      c.int = Math.max(1, next); c.reps++; c.due = t + c.int;
    }
    SK.logActivity('cards');
    SK.save();
  };
  SK.nextIntervalLabel = function (word, grade) {
    const c = SK.S.cards[word.id] || { int: 0, ease: 2.5, reps: 0 };
    if (grade === 1) return 'сьогодні';
    let next;
    if (c.reps === 0) next = grade === 4 ? 3 : 1;
    else if (c.reps === 1) next = grade === 2 ? 2 : grade === 4 ? 6 : 4;
    else next = Math.round(c.int * (grade === 2 ? 1.2 : grade === 4 ? c.ease * 1.3 : c.ease));
    next = Math.max(1, next);
    return next < 30 ? next + ' дн.' : Math.round(next / 30) + ' міс.';
  };
})(window.SK);

</script>
<script>
/* Генератор вправ на числа, ціни, час і дати (без DOM — його також використовує validate.mjs).
 * У даних уроку: { t: 'g', g: '<назва>', min?, max? } — під час запуску перетворюється на звичайну вправу 'l' або 'i'. */
window.SK = window.SK || {};
(function (SK) {
  'use strict';
  const ONES = ['nula', 'jeden', 'dva', 'tri', 'štyri', 'päť', 'šesť', 'sedem', 'osem', 'deväť', 'desať', 'jedenásť', 'dvanásť', 'trinásť',
    'štrnásť', 'pätnásť', 'šestnásť', 'sedemnásť', 'osemnásť', 'devätnásť'];
  const TENS = ['', '', 'dvadsať', 'tridsať', 'štyridsať', 'päťdesiat', 'šesťdesiat', 'sedemdesiat', 'osemdesiat', 'deväťdesiat'];
  const HUND = ['', 'sto', 'dvesto', 'tristo', 'štyristo', 'päťsto', 'šesťsto', 'sedemsto', 'osemsto', 'deväťsto'];
  const THOU = ['', 'tisíc', 'dvetisíc', 'tritisíc', 'štyritisíc', 'päťtisíc', 'šesťtisíc', 'sedemtisíc', 'osemtisíc', 'deväťtisíc'];
  // «О котрій?» — порядкове числівник ж. р. у місцевому відмінку
  const HOUR_LOC = ['', 'jednej', 'druhej', 'tretej', 'štvrtej', 'piatej', 'šiestej', 'siedmej', 'ôsmej', 'deviatej', 'desiatej', 'jedenástej',
    'dvanástej', 'trinástej', 'štrnástej', 'pätnástej', 'šestnástej', 'sedemnástej', 'osemnástej', 'devätnástej', 'dvadsiatej',
    'dvadsiatej prvej', 'dvadsiatej druhej', 'dvadsiatej tretej'];
  // Дата: порядковий числівник у родовому відмінку
  const ORD_GEN = ['', 'prvého', 'druhého', 'tretieho', 'štvrtého', 'piateho', 'šiesteho', 'siedmeho', 'ôsmeho', 'deviateho', 'desiateho',
    'jedenásteho', 'dvanásteho', 'trinásteho', 'štrnásteho', 'pätnásteho', 'šestnásteho', 'sedemnásteho', 'osemnásteho', 'devätnásteho', 'dvadsiateho'];
  for (let d = 21; d <= 29; d++) ORD_GEN[d] = 'dvadsiateho ' + ORD_GEN[d - 20];
  ORD_GEN[30] = 'tridsiateho'; ORD_GEN[31] = 'tridsiateho prvého';
  const MONTH_GEN = ['', 'januára', 'februára', 'marca', 'apríla', 'mája', 'júna', 'júla', 'augusta', 'septembra', 'októbra', 'novembra', 'decembra'];
  const MONTH_DAYS = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

  /** Число 0–9999 словами, складені — разом (dvadsaťpäť, stotridsaťštyri). g: 'm' (jeden, dva) | 'f' (jedna, dve) | 'n' (jedno, dve) */
  function words(n, g) {
    if (n === 0) return 'nula';
    if (n === 1) return g === 'f' ? 'jedna' : g === 'n' ? 'jedno' : 'jeden';
    if (n === 2) return g === 'f' || g === 'n' ? 'dve' : 'dva';
    const th = Math.floor(n / 1000), h = Math.floor((n % 1000) / 100), r = n % 100;
    let s = THOU[th] + HUND[h];
    if (r) s += r < 20 ? ONES[r] : TENS[Math.floor(r / 10)] + (r % 10 ? ONES[r % 10] : '');
    return s;
  }
  // Ціна: 1 euro / 2–4 eurá / 5+ eur (після складених чисел, написаних разом, — теж eur)
  function euros(e) {
    if (e === 1) return 'jedno euro';
    if (e >= 2 && e <= 4) return words(e, 'n') + ' eurá';
    return words(e) + ' eur';
  }
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const digits = (s) => String(s).replace(/[^\d]/g, '');

  const G = {
    // 🎧 число → цифрами
    numListen(sp) {
      const n = rnd(sp.min ?? 0, sp.max ?? 100);
      return { t: 'l', h: 'Прослухайте й запишіть цифрами', say: words(n), a: String(n), nodia: true, ph: 'цифрами, напр. 47',
        check: (v) => (digits(v) !== '' && Number(digits(v)) === n ? 'ok' : 'bad'), e: 'Словами: ' + words(n) };
    },
    // 🎧 ціна → цифрами
    priceListen(sp) {
      const e = rnd(sp.min ?? 1, sp.max ?? 49);
      const c = Math.random() < 0.25 ? 0 : rnd(10, 99);
      const say = euros(e) + (c ? ' ' + words(c) : '');
      const shown = e + ',' + String(c).padStart(2, '0') + ' €';
      return { t: 'l', h: 'Прослухайте ціну й запишіть цифрами', say, a: shown, nodia: true, ph: 'напр. 3,49',
        check: (v) => {
          const m = String(v).replace(/€|eur[aá]?/gi, '').replace(/\s+/g, '').replace(',-', '').replace(',', '.');
          return m !== '' && !isNaN(+m) && Math.round(+m * 100) === e * 100 + c ? 'ok' : 'bad';
        }, e: 'Словами: ' + say };
    },
    // 🎧 «о котрій» → цифрами
    timeListen() {
      const h = rnd(1, 23), m = Math.random() < 0.4 ? 0 : rnd(10, 59);
      const say = 'o ' + HOUR_LOC[h] + (m ? ' ' + words(m) : '');
      const shown = h + ':' + String(m).padStart(2, '0');
      return { t: 'l', h: 'Прослухайте час і запишіть цифрами', say, a: shown, nodia: true, ph: 'напр. 14:30',
        check: (v) => {
          // Кома — бо на телефоні цифрова клавіатура (inputmode="decimal") у словацькій і українській локалі має кому, а не двокрапку
          const p = String(v).trim().match(/^(\d{1,2})(?:\s*[:.,\s]\s*(\d{2}))?$/);
          if (!p) return 'bad';
          const hh = +p[1], mm = p[2] ? +p[2] : 0;
          return mm === m && (hh === h || (h <= 12 && hh === h + 12) || (h > 12 && hh === h - 12)) ? 'ok' : 'bad';
        }, e: 'Словами: ' + say + (h <= 12 ? ' (можна і ' + (h + 12) + ':' + String(m).padStart(2, '0') + ')' : '') };
    },
    // 🎧 дата → цифрами
    dateListen() {
      const mo = rnd(1, 12), d = rnd(1, MONTH_DAYS[mo]);
      const say = ORD_GEN[d] + ' ' + MONTH_GEN[mo];
      return { t: 'l', h: 'Прослухайте дату й запишіть цифрами (день. місяць.)', say, a: d + '. ' + mo + '.', nodia: true, ph: 'напр. 24. 8.',
        check: (v) => { const p = String(v).match(/(\d{1,2})\D+(\d{1,2})/); return p && +p[1] === d && +p[2] === mo ? 'ok' : 'bad'; },
        e: 'Словами: ' + say };
    },
    // ✍️ число → словами
    numWords(sp) {
      const n = rnd(sp.min ?? 0, sp.max ?? 100);
      const a = [words(n)];
      if (n === 1) a.push('jedna', 'jedno');
      if (n === 2) a.push('dve');
      return { t: 'i', q: 'Напишіть словами число <b>' + n + '</b>', a, nospace: true, say: words(n), e: 'Складені числа пишуть разом: [[' + words(n) + ']]' };
    },
    // ✍️ час → словами
    timeWords() {
      const h = rnd(1, 23), m = Math.random() < 0.6 ? 0 : [15, 20, 30, 45][rnd(0, 3)];
      const ans = 'o ' + HOUR_LOC[h] + (m ? ' ' + words(m) : '');
      return { t: 'i', q: 'О котрій? Напишіть словами: <b>' + h + ':' + String(m).padStart(2, '0') + '</b>', a: [ans, ans.slice(2)], nospace: true, e: '[[' + ans + ']]' };
    },
    // ✍️ дата → словами
    dateWords() {
      const mo = rnd(1, 12), d = rnd(1, MONTH_DAYS[mo]);
      const ans = ORD_GEN[d] + ' ' + MONTH_GEN[mo];
      return { t: 'i', q: 'Напишіть дату словами: <b>' + d + '. ' + mo + '.</b>', a: ans, nospace: true, e: '[[' + ans + ']] — день у родовому відмінку + місяць у родовому' };
    }
  };

  SK.gen = {
    words, euros, HOUR_LOC, ORD_GEN, MONTH_GEN, list: G,
    make(spec) {
      const f = G[spec.g];
      if (!f) throw new Error('Невідомий генератор вправ: ' + spec.g);
      return f(spec);
    }
  };
})(window.SK);

</script>
<script>
/* Рушій вправ: c — вибір (перший варіант правильний), i — введення, o — порядок слів, l — диктант, g — генерована (gen.js) */
(function (SK) {
  'use strict';
  const esc = SK.esc;
  const DIA = ['á', 'ä', 'č', 'ď', 'é', 'í', 'ĺ', 'ľ', 'ň', 'ó', 'ô', 'ŕ', 'š', 'ť', 'ú', 'ý', 'ž'];

  // Екранна клавіатура з діакритикою; вставляє в останнє поле вводу
  SK.diaKeyboard = function (getInput) {
    const wrap = document.createElement('div');
    wrap.className = 'dia';
    let upper = false;
    const draw = () => {
      wrap.innerHTML = DIA.map((ch) => '<button type="button" data-ch="' + ch + '">' + (upper ? ch.toUpperCase() : ch) + '</button>').join('') +
        '<button type="button" data-shift="1" title="Великі літери">⇧</button>';
    };
    draw();
    wrap.addEventListener('mousedown', (e) => e.preventDefault());
    wrap.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.shift) { upper = !upper; draw(); return; }
      const inp = getInput(); if (!inp) return;
      const ch = upper ? b.dataset.ch.toUpperCase() : b.dataset.ch;
      const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? inp.value.length;
      inp.value = inp.value.slice(0, s) + ch + inp.value.slice(en);
      inp.focus(); inp.setSelectionRange(s + 1, s + 1);
    });
    return wrap;
  };

  const shown = (a) => (Array.isArray(a) ? a[0] : a);

  /**
   * specs — вправи уроку; opts.onFinish(score%), opts.drill (без «урок зараховано»),
   * opts.saveKey — id уроку: тоді незавершений підхід зберігається в стані уроку (run) і його можна продовжити пізніше.
   * run = { n: кількість вправ, q: [[індекс, повтор?], …], pos, ft: {індекс: правильно з першої спроби?}, sk: {індекс: пропущено} }
   */
  SK.runExercises = function (root, specs, opts) {
    opts = opts || {};
    const lst = opts.saveKey ? SK.lessonState(opts.saveKey) : null;
    const last = {}; // останній показаний варіант кожної вправи (генеровані щоразу нові)
    const make = (i) => (last[i] = Object.assign(specs[i].t === 'g' ? SK.gen.make(specs[i]) : Object.assign({}, specs[i]), { _i: i }));
    const fresh = () => ({ n: specs.length, q: SK.shuffle(specs.map((_, i) => [i, 0])), pos: 0, ft: {}, sk: {} });
    const save = () => { if (lst) { lst.run = run; SK.save(); } };
    const clear = () => { if (lst) { delete lst.run; SK.save(); } };
    let run;

    const saved = lst && lst.run && lst.run.n === specs.length && Array.isArray(lst.run.q) && (lst.run.pos > 0 || Object.keys(lst.run.ft || {}).length) && lst.run.pos < lst.run.q.length ? lst.run : null;
    if (saved && !opts.forceNew) {
      const answered = Object.keys(saved.ft).length;
      root.innerHTML = '<div class="ex-box card center"><h3>⏸ Незавершений підхід</h3><p>Ви вже виконали <b>' + answered + ' з ' + specs.length + '</b> завдань цього уроку.</p>' +
        '<div class="row" style="justify-content:center"><button class="btn primary cont">▶ Продовжити</button><button class="btn restart">↺ Почати заново</button></div></div>';
      root.querySelector('.cont').onclick = () => { run = saved; next(); };
      root.querySelector('.restart').onclick = () => { run = fresh(); save(); next(); };
      return;
    }
    run = fresh();
    if (lst) delete lst.run;

    function finish() {
      const total = specs.length;
      const ok = Object.values(run.ft).filter(Boolean).length;
      const skipped = Object.keys(run.sk).length;
      const score = total ? Math.round((ok / total) * 100) : 0;
      const wrong = Object.keys(run.ft).filter((i) => run.ft[i] === false).map((i) => last[i] || make(+i));
      clear();
      root.innerHTML = '<div class="ex-box card center">' +
        '<h2>' + (score >= 80 ? '🎉 Чудово!' : score >= 60 ? '👍 Непогано!' : '💪 Варто повторити') + '</h2>' +
        '<div class="stat">' + score + '%</div><p class="muted">правильно з першої спроби: ' + ok + ' з ' + total + (skipped ? ' · пропущено: ' + skipped : '') + '</p>' +
        (opts.drill ? '' : score >= 80 ? '<p class="good">Урок зараховано (потрібно ≥ 80%).</p>' : '<p class="note">Для зарахування потрібно ≥ 80%. Перечитайте теорію і спробуйте ще раз — це нормально. Якщо тему ви вже знаєте, урок можна пропустити кнопкою вгорі.</p>') +
        (wrong.length ? '<div class="small" style="text-align:left"><b>Де були помилки або пропуски:</b><ul>' + wrong.map((w) => '<li>' + esc(stripTags(w.q || w.h || 'Диктант')) + ' → <b>' + esc(answerText(w)) + '</b></li>').join('') + '</ul></div>' : '') +
        '<div class="row" style="justify-content:center;margin-top:10px"><button class="btn primary again">Ще раз</button></div></div>';
      root.querySelector('.again').onclick = () => SK.runExercises(root, specs, Object.assign({}, opts, { forceNew: true }));
      if (opts.onFinish) opts.onFinish(score);
    }
    function stripTags(s) { return String(s).replace(/<[^>]+>/g, '').replace(/\[\[|\]\]/g, ''); }
    function answerText(it) { return it.t === 'c' ? (it.o[it.a || 0]) : shown(it.a); }

    function next() {
      if (run.pos >= run.q.length) return finish();
      const [i, retry] = run.q[run.pos];
      render(make(i), retry);
    }
    // ok — правильно; skip — учень пропустив завдання (не повертається в кінець черги)
    function record(it, ok, skip) {
      if (!(it._i in run.ft)) run.ft[it._i] = ok;
      if (skip) run.sk[it._i] = 1;
      else if (!ok && !run.q[run.pos][1]) run.q.push([it._i, 1]);
      SK.logActivity('ex');
      save();
    }

    function render(it, retry) {
      SK._exCurrent = it; // для самоперевірки (tools/selftest-console.js)
      const progress = Math.round((run.pos / run.q.length) * 100);
      root.innerHTML = '<div class="ex-box card">' +
        '<div class="row small muted"><span>Завдання ' + (run.pos + 1) + ' з ' + run.q.length + (retry ? ' · повтор' : '') + '</span><span class="spacer"></span>' +
        (lst ? '<button class="btn small restart" title="Почати підхід заново">↺</button>' : '') + '<span class="pill gray">' + typeName(it.t) + '</span></div>' +
        '<div class="bar" style="margin:8px 0 12px"><i style="width:' + progress + '%"></i></div>' +
        '<div class="ex-body"></div><div class="fb"></div>' +
        '<div class="row" style="margin-top:12px"><button class="btn skip" title="Показати відповідь і перейти далі">Пропустити ⏭</button><span class="spacer"></span><button class="btn primary act">Перевірити</button></div>' +
        (lst ? '<p class="small muted" style="margin:8px 0 0">Прогрес підходу зберігається автоматично — можна закрити й продовжити пізніше.</p>' : '') + '</div>';
      const body = root.querySelector('.ex-body');
      const fb = root.querySelector('.fb');
      const act = root.querySelector('.act');
      const skipBtn = root.querySelector('.skip');
      let checked = false;
      const goNext = () => { run.pos++; save(); next(); };
      const showFb = (state, extra) => {
        const msg = state === 'ok' ? '✅ Правильно!' : state === 'dia' ? '🟡 Майже — перевірте діакритику.' : state === 'skip' ? '⏭ Пропущено.' : '❌ Ні.';
        fb.innerHTML = '<div class="feedback ' + (state === 'skip' ? 'dia' : state) + '">' + msg +
          (state !== 'ok' ? ' Правильно: <b>' + esc(answerText(it)) + '</b>' : '') +
          (it.e ? '<div class="small" style="margin-top:4px">' + SK.rich(it.e) + '</div>' : '') + (extra || '') + '</div>';
        act.textContent = 'Далі →'; act.style.display = ''; checked = true; skipBtn.style.display = 'none';
        act.onclick = goNext; act.focus();
      };
      const r = root.querySelector('.restart');
      if (r) r.onclick = () => {
        if (!r.dataset.sure) { r.dataset.sure = '1'; r.textContent = '↺ Точно почати заново?'; setTimeout(() => { r.dataset.sure = ''; r.textContent = '↺'; }, 3000); return; }
        run = fresh(); save(); next();
      };
      skipBtn.onclick = () => {
        if (checked) return;
        if (it.t === 'c') body.querySelectorAll('.opt').forEach((x) => { x.disabled = true; if (x.dataset.v === it.o[it.a || 0]) x.classList.add('ok'); });
        const inp = body.querySelector('.ans'); if (inp) inp.readOnly = true;
        record(it, false, true); showFb('skip');
      };

      if (it.t === 'c') {
        const correct = it.o[it.a || 0];
        body.innerHTML = '<div class="ex-q">' + SK.rich(it.q) + '</div><div class="opts">' +
          SK.shuffle(it.o).map((o) => '<button class="opt" data-v="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>';
        act.style.display = 'none';
        body.querySelectorAll('.opt').forEach((b) => b.onclick = () => {
          if (checked) return;
          const ok = b.dataset.v === correct;
          body.querySelectorAll('.opt').forEach((x) => { x.disabled = true; if (x.dataset.v === correct) x.classList.add('ok'); });
          if (!ok) b.classList.add('bad');
          record(it, ok); showFb(ok ? 'ok' : 'bad');
        });
      } else if (it.t === 'i' || it.t === 'l') {
        body.innerHTML = it.t === 'l'
          ? '<div class="ex-q">🎧 ' + esc(it.h || 'Прослухайте й напишіть словацькою') + (it.q ? ': <span class="muted">' + esc(it.q) + '</span>' : '') + '</div>' +
            '<div class="row" style="margin-bottom:10px"><button class="btn play">🔊 Ще раз</button><button class="btn slow">🐢 Повільно</button><button class="btn small reveal">Не чути? Показати текст</button></div>'
          : '<div class="ex-q">' + SK.rich(it.q) + '</div>';
        // autocorrect і lang — щоб клавіатура телефона не «виправляла» словацькі слова на англійські чи українські
        body.insertAdjacentHTML('beforeend', '<input type="text" class="ans" lang="' + (it.nodia ? 'uk' : 'sk') + '" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"' +
          (it.nodia ? ' inputmode="decimal"' : '') + ' placeholder="' + esc(it.ph || 'Ваша відповідь') + '">');
        const inp = body.querySelector('.ans');
        if (!it.nodia) body.appendChild(SK.diaKeyboard(() => inp));
        if (it.t === 'l') {
          const txt = it.say || shown(it.a);
          body.querySelector('.play').onclick = () => SK.TTS.say(txt);
          body.querySelector('.slow').onclick = () => SK.TTS.say(txt, 0.6);
          body.querySelector('.reveal').onclick = (e) => { e.target.outerHTML = '<span class="small muted">Текст: ' + esc(txt) + '</span>'; };
          setTimeout(() => SK.TTS.say(txt), 250);
        }
        // На телефоні автофокус відкриває екранну клавіатуру, і та закриває питання та кнопки 🔊 диктанту
        if (!SK.touch()) setTimeout(() => inp.focus(), 50);
        act.onclick = () => {
          if (checked) return;
          // check — власна перевірка генерованої вправи; nospace — пробіли не важливі (dvadsaťpäť = dvadsať päť)
          const nos = (s) => String(s).replace(/\s+/g, '');
          const list = Array.isArray(it.a) ? it.a : [it.a];
          const st = it.check ? it.check(inp.value) : it.nospace ? SK.check(nos(inp.value), list.map(nos)) : SK.check(inp.value, it.a);
          const ok = st === 'ok' || (st === 'dia' && !SK.S.settings.strict);
          inp.classList.add(ok ? 'ok' : 'bad'); inp.readOnly = true;
          record(it, ok); showFb(st, it.t === 'l' && it.tr ? '<div class="small">Переклад: ' + esc(it.tr) + '</div>' : '');
        };
        inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); act.click(); } });
      } else if (it.t === 'o') {
        const target = shown(it.a);
        const pool = target.split(' ');
        let order = SK.shuffle(pool);
        for (let k = 0; k < 5 && pool.length > 2 && order.join(' ') === target; k++) order = SK.shuffle(pool);
        const chosen = [];
        body.innerHTML = '<div class="ex-q">Складіть речення: <b>' + esc(it.q) + '</b></div>' +
          '<div class="tokens ans-area" title="Натисніть слово, щоб повернути"></div><div class="tokens pool" style="border-style:solid"></div>';
        const area = body.querySelector('.ans-area'), poolEl = body.querySelector('.pool');
        const draw = () => {
          area.innerHTML = chosen.map((w, k) => '<button class="tok" data-k="' + k + '">' + esc(w) + '</button>').join('') || '<span class="muted small">Натискайте слова внизу…</span>';
          poolEl.innerHTML = order.map((w, k) => '<button class="tok" data-k="' + k + '">' + esc(w) + '</button>').join('');
        };
        draw();
        area.onclick = (e) => { const b = e.target.closest('.tok'); if (!b || checked) return; order.push(chosen.splice(+b.dataset.k, 1)[0]); draw(); };
        poolEl.onclick = (e) => { const b = e.target.closest('.tok'); if (!b || checked) return; chosen.push(order.splice(+b.dataset.k, 1)[0]); draw(); };
        act.onclick = () => {
          if (checked) return;
          if (order.length) { SK.toast('Використайте всі слова'); return; }
          const st = SK.check(chosen.join(' '), it.a);
          const ok = st === 'ok' || st === 'dia';
          record(it, ok); showFb(ok ? 'ok' : 'bad', '<div class="row" style="margin-top:6px"><button class="btn small" onclick="SK.TTS.say(' + esc(JSON.stringify(target)) + ')">🔊 Послухати</button></div>');
        };
      }
    }
    function typeName(t) { return { c: 'вибір', i: 'напишіть', o: 'порядок слів', l: 'диктант' }[t] || t; }

    next();
  };
})(window.SK);

</script>
<script>

window.SK = window.SK || {};
SK.lessons = SK.lessons || [];
SK.lessons.push(
{

</table></div>
<div class="tip"><b>y ≠ українське «и».</b> Словацькі <b>i</b> та <b>y</b> звучать однаково — як «і». Різниця лише в написанні: її вчать для письма (рівень B1–B2).</div>

<p class="small muted">Натискайте на сині слова, щоб послухати. Якщо звуку немає, відкрийте «Налаштування» і виберіть словацький голос.</p>`,
  vocab: [['cukor', 'цукор'], ['ulica', 'вулиця'], ['chlieb', 'хліб'], ['chyba', 'помилка'], ['hora', 'гора; також «ліс»'], ['hlava', 'голова'],
    ['jablko', 'яблуко'], ['byt', 'квартира', 'не «побут»!'], ['syn', 'син'], ['ryba', 'риба'], ['voda', 'вода'], ['mlieko', 'молоко'],
    ['káva', 'кава'], ['mama', 'мама'], ['otec', 'батько'], ['dom', 'дім'], ['Slovensko', 'Словаччина'], ['Ukrajina', 'Україна']],
  ex: [
    { t: 'c', q: 'Як читається <b>c</b> у слові «ulica»?', o: ['ц', 'к', 'с'] },

    { t: 'c', q: '<b>g</b> у слові «guma» звучить як…', o: ['ґ', 'г', 'дж'] },
